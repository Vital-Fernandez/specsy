ChiSq_Recomb = "$\\chi^{2}_{Recomb}$"
ChiSq_Metals = "$\\chi^{2}_{Metals}$"
ChiSq_O = "$\\chi^{2}_{O}$"
ChiSq_S = "$\\chi^{2}_{S}$"
S2_abund = "$S^{+}$"
log_He1r = "$log(y^{+})$"
log_He2r = "$log(y^{2+})$"
OH = "$\\frac{O}{H}$"
OH_err = "$O/H\\,err$"
