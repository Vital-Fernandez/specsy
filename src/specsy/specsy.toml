[latex_param_notation]
temp_low="$Te_{low}(K)$"
temp_med="$Te_{med}(K)$"
temp_high="$Te_{high}(K)$"
temp_vhigh="$Te_{vhigh}(K)$"

den_low="$ne_{low}(cm^{-3})$"
den_med="$ne_{med}(cm^{-3})$"
den_high="$ne_{high}(cm^{-3})$"
den_vhigh="$ne_{vhigh}(cm^{-3})$"

cHBeta = "$c(H\\beta)$"

S2  = "$12+log(S^{+}/H^{+})$"
S3  = "$12+log(S^{2+}/H^{+})$"
S4  = "$12+log(S^{3+}/H^{+})$"
O2  = "$12+log(O^{+}/H^{+})$"
O3  = "$12+log(O^{2+}/H^{+})$"
N2 =  "$12+log(Ni^{+}/H^{+})$"
N3 =  "$12+log(Ni^{2+}/H^{+})$"
NI3 = "$12+log(Ni^{2+}/H^{+})$"
Cl3 = "$12+log(Cl^{2+}/H^{+})$"
Cl4 = "$12+log(Cl^{3+}/H^{+})$"
Ne3 = "$12+log(Ne^{2+}/H^{+})$"
Fe3 = "$12+log(Fe^{2+}/H^{+})$"
Ar3 = "$12+log(Ar^{2+}/H^{+})$"
Ar4 = "$12+log(Ar^{3+}/H^{+})$"
He1r = "$y^{+}$"
He2r = "$y^{2+}$"
He1 = "$y^{+}$"
He2 = "$y^{2+}$"

Ar = "$\\frac{Ar}{H}$"
He = "$\\frac{He}{H}$"
O = "$\\frac{O}{H}$"
N = "$\\frac{N}{H}$"
S = "$\\frac{S}{H}$"
NO = "$\\frac{N}{O}$"

y_plus = "$y^{+}$"

He1_abund = "$y^{+}$"
