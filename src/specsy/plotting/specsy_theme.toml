[display_variables.bokeh]
BOKEH_TOOLS = "pan,wheel_zoom,box_zoom,reset,save"

# Layout in pixels. Every panel has a fixed outer size (frame + borders), so the boxes add up exactly: the spectrum is
# as tall as the scatter-matrix rows, and with the same top and bottom borders its frame lines up with theirs
BORDER_TOP = 30     # title row
BORDER_MID = 5      # between scatter-matrix rows
BORDER_BOTTOM = 55  # x axis with its label
BORDER_LEFT = 60    # y axis with its label (first scatter-matrix column)
BORDER_INNER = 10   # other scatter-matrix columns
BORDER_RIGHT = 5
GAP = 20            # between the left and right columns
DIV_HEIGHT = 30     # conditions and "Traces" headers

_BK_LAYOUT_KEYS = ["width", "height", "sizing_mode", "margin", "min_border_top", "min_border_bottom",
                   "min_border_left", "min_border_right"]
_BK_STYLE_SKIP = ["width", "height", "sizing_mode", "aspect_ratio", "match_aspect", "margin", "width_policy",
                  "height_policy", "x_axis_type", "y_axis_type", "toolbar_location"]

SELECTION_LABEL = "Mouse selection"
CONDITION_LABELS = ["log(age)", "Z", "E(B-V)", "log(A)"]
CONDITION_FORMATS = [".2f", ".4f", ".2f", ".2f"]

