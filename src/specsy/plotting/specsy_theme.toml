'axes.titlesize' = 14
'axes.labelsize' = 14
'axes.labelpad' = 4.0
'legend.fontsize' = 12
'xtick.labelsize' = 12
'ytick.labelsize' = 12

[bokeh.figure.trace_plot] # Individual figure format
