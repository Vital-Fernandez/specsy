[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specsy"
version = "0.9.dev3"
readme = "README.rst"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "Vital Fernández", email = "vgf@umich.edu"}]
description = "Model fitting package for the chemical analysis of astronomical spectra"
dependencies = ["arviz~=0.23.4",
                "corner~=2.2",
                "h5netcdf~=1.3.0",
                "jax~=0.9.2",
                "jaxlib~=0.9.2",
                "aspect-stable~=0.7.dev1",
                "lime-stable~=2.2.dev4",
                "innate-stable~=0.2.2",
                "pymc~=5.28",
                "toml~=0.10",
                "xarray~=2026.2.0"]

classifiers = ["Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3.11"]

[project.optional-dependencies]
tensors = ["pytensor~=2.38.2",
           "blackjax~=1.5",
           "numba~=0.65.1",
           "numpyro~=0.21.0",
           "nutpie~=0.16.8"]

docs = ["sphinx-rtd-theme~=3.0",
        "ipympl~=0.9",
        "myst-nb~=1.3"]

tests = ["pytest~=8.4",
         "pytest-cov~=7.0",
         "pytest-mpl~=0.17"]


[tool.pytest.ini_options]
pythonpath = ["src"]
mpl-baseline-path = 'tests/baseline'
mpl-results-path = 'tests/outputs'
mpl-results-always = false
addopts = "-p no:asdf_schema_tester"
