[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specsy"
version = "0.9.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
               "Programming Language :: Python :: 3.12"]

authors = [{name = "Vital Fernández", email = "vgf@stsci.edu"}]
description = "Model fitting package for the chemical analysis of astronomical spectra"

dependencies = ["arviz~=1.2.0",
                "corner~=2.2.3",
                "h5netcdf~=1.8.1",
                "jax~=0.10.2",
                "jaxlib~=0.10.2",
                "pyneb==1.1.30",
                "lime-stable[full]~=2.4.1",
                "aspect-stable~=0.8.0",
                "innate-stable~=0.2.2",
                "pymc[nutpie]~=6.0.1",
                "toml~=0.10.2",
                "tomlkit==0.15.0",
                "xarray~=2026.4.0"]

[project.optional-dependencies]
full = ["numpyro~=0.21.0",
        "blackjax~=1.5",
        "numba~=0.65.1"]

docs = ["sphinx~=9.1.0",
        "sphinx-rtd-theme~=3.1",
        "sphinx_togglebutton~=0.4.5",
        "sphinx_book_theme~=1.2",
        "ipympl~=0.10",
        "myst-nb~=1.4"]

tests = ["pytest~=9.1.1",
         "pytest-cov~=7.1.0",
         "pytest-mpl~=0.19.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
mpl-baseline-path = 'tests/baseline'
mpl-results-path = 'tests/outputs'
mpl-results-always = false
addopts = "-p no:asdf_schema_tester"

[tool.setuptools.package-data]
specsy = ["resources/data/*",
          "resources/images/*"]
